name: انتشار سایت در گیت‌هاب پیجز

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد مخزن
        uses: actions/checkout@v4

      - name: آماده‌سازی گیت‌هاب پیجز
        uses: actions/configure-pages@v5

      - name: بارگذاری فایل‌های ایستا
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: انتشار در گیت‌هاب پیجز
        id: deployment
        uses: actions/deploy-pages@v4
